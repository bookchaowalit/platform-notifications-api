[project]
name = "solo-notifications"
version = "0.1.0"
description = "Notifications cell: notification rules and the notification log, with its own database"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1.4", "mcp>=2.3,<3"]
mcp = ["mcp>=2.3,<3"]  # notifications-mcp (solo_notifications.mcp_server); not needed by the API image

[project.scripts]
notifications-api = "solo_notifications.app:main"
notifications-db = "solo_notifications.db:main"
notifications-dispatch = "solo_notifications.dispatch:main"
notifications-mcp = "solo_notifications.mcp_server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
